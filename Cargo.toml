[package]
name = "nm"
version = "0.1.0"
edition = "2021"
description = "Axum-based web server"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1.28", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
